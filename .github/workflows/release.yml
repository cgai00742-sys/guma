name: release desktop app

# Pushing a tag like v0.1.0 builds Guma as a native app for Mac (both Intel
# and Apple Silicon), Windows, and Linux, and attaches the installers to a
# draft GitHub Release. workflow_dispatch lets us trigger the same build by
# hand from the Actions tab, without needing a tag, while we're still
# testing this pipeline.
#
# Desktop builds no longer need the two Supabase secrets below to succeed —
# src/lib/data.ts picks the local SQLite backend (src/lib/data.local.ts) at
# runtime whenever the app is running inside Tauri, and never even loads the
# Supabase client in that case (it's reached only through a dynamic import,
# so a fork with no Supabase project configured builds and runs the desktop
# app fine with these two secrets simply unset — confirmed by a full
# `tauri build` with no VITE_SUPABASE_* env vars present at all). They're
# still passed through here, harmlessly, in case a later feature wants an
# optional cloud-sync mode available from the desktop app too; nothing
# today depends on them being set.
#
# Unsigned for now (see the project board's Phase 4 "code-signing budget"
# task): Mac will show an "unidentified developer" warning and Windows may
# show a SmartScreen warning on first open. Right-click -> Open (Mac) or
# "More info" -> "Run anyway" (Windows) gets past it. Revisit once real
# users are testing this.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install frontend dependencies
        # ci, not install: it installs exactly what the lockfile says and
        # fails loudly if package.json and the lockfile disagree. This
        # project has already lost a deploy to a lockfile regenerated on the
        # wrong platform; a release build is the last place to find out.
        run: npm ci

      - name: typecheck and test
        # A release that ships without running the suite is a release that
        # can ship a broken build. Runs once per platform, which is the
        # point -- the SQLite tests exercise a real engine, and "works on
        # Linux" is not the same claim as "works on Windows".
        #
        # The suite itself runs pinned to Pacific/Chatham (see
        # vite.config.ts). Every date in Guma is a local calendar date, and
        # a UTC runner cannot tell correct code from code that only agrees
        # with UTC -- which has already cost this project two bugs.
        run: |
          npx tsc -b --noEmit
          npm test

      # Six timezones from UTC-10 to UTC+14, including two that are not on
      # a whole hour. Two seconds each, and the last release-blocking bug
      # this project had was exactly this shape. Linux only: the sweep is
      # about the code's arithmetic, not the platform's.
      - name: Sweep the timezones
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run test:tz

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: guma-v__VERSION__
          releaseName: 'Guma v__VERSION__'
          releaseBody: |
            No account and no internet connection needed — your shop lives in
            one file on this computer, and the first launch goes straight into
            the setup wizard.

            See CHANGELOG.md for what is in this release and, just as
            importantly, its Known Limits.

            Unsigned for now — the README has the "unidentified developer"
            (macOS) and SmartScreen (Windows) workaround for first open.
          # Draft on purpose: a human reads the notes and checks the four
          # installers actually exist before anyone can download them.
          releaseDraft: true
          # prerelease was true through 0.x. A 1.0 that GitHub refuses to
          # show as "Latest release" is a 1.0 the README's download link
          # cannot find.
          prerelease: false
          args: ${{ matrix.args }}
